# Security response headers — include this file in your nginx server {} block:
#   include /path/to/nginx-security-headers.conf;
#
# These complement the CSP meta tag in index.html. Do not add a global HTTP CSP
# here because this host also serves PocketBase Admin UI under /_/.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
