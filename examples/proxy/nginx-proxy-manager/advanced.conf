# Paste into the proxy host's Advanced configuration in Nginx Proxy Manager.
# The proxy host itself should use:
#   Scheme: http
#   Forward hostname/IP: the Docker host or app service reachable by NPM
#   Forward port: 8091
#   Websockets support: enabled
#   SSL: enabled, Force SSL enabled

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
