name: ${COMPOSE_PROJECT_NAME:-xjtlu-timetable}

services:
  app:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}:${IMAGE_TAG:?set IMAGE_TAG to an exact release or reviewed commit}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8091}:8080"
    volumes:
      - "${DATA_DIR:-./data}:/pb/pb_data"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
