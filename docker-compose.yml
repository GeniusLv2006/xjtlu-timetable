services:
  app:
    image: ghcr.io/geniuslv2006/xjtlu-timetable:${IMAGE_TAG:?set IMAGE_TAG to an exact reviewed commit}
    pull_policy: always
    container_name: xjtlu-timetable
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    ports:
      - "172.17.0.1:8091:8080"
    volumes:
      - ./backend/pb_data:/pb/pb_data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
